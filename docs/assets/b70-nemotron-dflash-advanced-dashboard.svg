<title id="title">Intel Arc Pro B70 Nemotron-3.5-Lightning DFlash advanced card</title>
<desc id="desc">Lane 1 n=5 C1 on one Arc Pro B70: representative decode 186.61 tok/s client post-first at p2048/g128; cold input 7160 at p8192/g1 (prompt/TTFT). Matched 1.81× vs no-spec graphs at p8192/g128. Capacity completed 119,904 tokens.</desc>
