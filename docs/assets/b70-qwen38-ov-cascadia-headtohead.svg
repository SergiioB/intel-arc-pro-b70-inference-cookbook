  <text x="60" y="760" fill="#aeb9c7" font-size="18" font-family="Segoe UI, Inter, sans-serif">Hub OpenVINO/Qwen3.8-27B-int4-ov: garbage on GPU and CPU. Working IR: SergiioB/Qwen3.8-27B-int4-gdn8-ov (GDN left float).</text>
  <text x="60" y="800" fill="#aeb9c7" font-size="18" font-family="Segoe UI, Inter, sans-serif">Cascadia LATENCY=f16 vs THROUGHPUT: 4.95 vs 4.92. Plugin hints do not close the 3.2× gap.</text>
  <text x="60" y="860" fill="#64748b" font-size="15" font-family="Segoe UI, Inter, sans-serif">Research only. Not a catalog row vs GPTQ vLLM.</text>
