<text x="846" y="968" fill="#9caec4" font-size="16" font-weight="500" text-anchor="start">Prefill flat (~1691 vs 1696). v5 mixed-split is speed-flat.</text>
<text x="846" y="1002" fill="#9caec4" font-size="16" font-weight="500" text-anchor="start">128K S+M1 62.52 n=5 is isolated C1 (870 MiB) — not serving.</text>
<text x="846" y="1036" fill="#9caec4" font-size="16" font-weight="500" text-anchor="start">Prefix-on agentic is a separate card (58.86 vs 43.81).</text>
<text x="846" y="1070" fill="#ff7a7a" font-size="16" font-weight="600" text-anchor="start">DFlash 2 overlay loaded; accept 0/574. Keep MTP4.</text>
