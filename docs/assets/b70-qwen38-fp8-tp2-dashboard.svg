<text x="82" y="212" fill="#55d6be" font-size="16" font-weight="700" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">C1 OUTPUT THROUGHPUT</text>
<text x="82" y="252" fill="#f5f8fc" font-size="26" font-weight="700" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">Client end-to-end output tok/s · five measured requests per cell</text>
