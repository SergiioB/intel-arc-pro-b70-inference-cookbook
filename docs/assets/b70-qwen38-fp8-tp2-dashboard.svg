<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1480" viewBox="0 0 1600 1480" role="img" aria-labelledby="title desc">
<title id="title">Qwen3.8-27B FP8 TP2 benchmark dashboard on dual Intel Arc Pro B70</title>
<desc id="desc">Three greedy random-token C1 cells for Qwen3.8-27B FP8 W8A16 with MTP8 on two Intel Arc Pro B70 GPUs in tensor parallel mode. Values are n=5 medians or explicitly labeled maxima. Cold input is endpoint prompt tokens divided by client TTFT. Self-reported E2 and not independently reproduced.</desc>
<rect width="1600" height="1480" fill="#07111f"/>
<text x="48" y="52" fill="#55d6be" font-size="16" font-weight="700" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">QWEN3.8-27B FP8 · DUAL B70 TP2 · vLLM XPU</text>
<text x="48" y="98" fill="#f5f8fc" font-size="36" font-weight="700" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">FP8 TP2 · W8A16 + Xe2 small-M · MTP8</text>
<text x="48" y="132" fill="#9caec4" font-size="18" font-weight="400" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">Greedy random-token diagnostic · C1 · cache disabled · 230 W configured cap per GPU</text>
<rect x="1190" y="30" width="362" height="88" rx="18" fill="#0f1d30"/>
<text x="1371" y="64" fill="#55d6be" font-size="20" font-weight="700" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif">E2 SELF-REPORTED</text>
<text x="1371" y="94" fill="#9caec4" font-size="13" font-weight="600" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif">independent reproduction pending</text>
