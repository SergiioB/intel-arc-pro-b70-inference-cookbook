  <text x="132" y="750" class="vt">20</text><line x1="135" y1="745" x2="140" y2="745" class="tick"/>
  <text x="140" y="920" class="vt">0</text>
  <text x="45" y="570" class="lbl" transform="rotate(-90 45 570)">decode tok/s (median)</text>

  <text x="140" y="958" class="lbl">512</text>
