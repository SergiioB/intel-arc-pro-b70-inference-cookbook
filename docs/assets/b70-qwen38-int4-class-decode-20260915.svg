  <text x="766" y="711" class="val" fill="#7dd3fc">21.7</text>
  <text x="1087" y="729" class="val" fill="#7dd3fc">19.6</text>
  <text x="1120" y="700" class="warn" font-family="Geist Mono,ui-monospace,monospace" font-size="13px" text-anchor="start">64K: CL_OUT_OF_RESOURCES — measured wall (u8 KV, no draft)</text>
 </g>

 <g transform="translate(45,1000)">
  <rect x="0" y="0" width="740" height="176" fill="#0f172a" stroke="#334155"/>
  <rect x="14" y="14" width="22" height="6" fill="#fb923c"/>
  <text x="44" y="22" class="lg">vLLM XPU · GPTQ-Int4 sym-G128 · 19 GB · 1× B70 · MTP4 · fp8 KV</text>
  <text x="44" y="44" class="lg">Leads at every length; 75.6 @512 drops to 34.5 @196K. KV-budget ceiling</text>
  <text x="44" y="64" class="lg">at ≈204K on one card (256K would need 9.33 GiB KV vs 7.47 GiB free).</text>
  <rect x="14" y="82" width="22" height="6" fill="#34d399"/>
  <text x="44" y="90" class="lg">llama.cpp SYCL · UD-Q4_K_M · 16.5 GB · 1× B70 · native draft-MTP · q8_0 KV</text>
  <text x="44" y="112" class="lg">Only engine to hold the full 256K: 37.8 → 15.9 (2.4× decay). Best long-context</text>
  <text x="44" y="132" class="lg">shape; ~155 W draw. Heaviest practical INT4-class setup wins at the edge.</text>
  <rect x="14" y="150" width="22" height="6" fill="#38bdf8"/>
  <text x="44" y="158" class="lg">OpenVINO GenAI · INT4-GDN8 · 21 GB · 1× B70 · no draft · u8 KV</text>
 </g>

 <g transform="translate(810,1000)">
  <rect x="0" y="0" width="745" height="176" fill="#0f172a" stroke="#334155"/>
  <text x="14" y="24" class="h">READING</text>
  <text x="14" y="52" class="body">· Same weight class now: vLLM 2.0× llama, llama 1.7× OV at 512.</text>
  <text x="14" y="80" class="body">· llama decays 2.4× over 512→256K; vLLM falls harder past 64K once the</text>
  <text x="14" y="106" class="body">  KV budget and graph capture start to bite (75.6 → 32.6 @128K).</text>
  <text x="14" y="134" class="body">· OV INT4-GDN8: ~22-20 tok/s flat to 32K, then the u8-KV resource wall.</text>
  <text x="14" y="160" class="body">  An MTP draft export is the known headroom (documented next target).</text>
 </g>

 <text x="45" y="1420" class="cap">INT4-class single-card comparison · 8-bit KV on all arms · n=3 to 64K, n=1 probes beyond · raw JSONs in results/qw38-ov-mtp-20260914/</text>
</svg>