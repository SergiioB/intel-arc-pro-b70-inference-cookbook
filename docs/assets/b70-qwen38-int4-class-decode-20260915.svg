  <!-- OV INT4-GDN8: 22.4 / 22.1 / 21.7 / 19.6, stops at 64K (CL_OUT_OF_RESOURCES) -->
  <polyline fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linejoin="round" stroke-dasharray="7 4"
   points="140,724 450,727 766,730 1087,748"/>
  <circle cx="140" cy="724" r="5.5" fill="#38bdf8"/>
  <circle cx="450" cy="727" r="5.5" fill="#38bdf8"/>
  <circle cx="766" cy="730" r="5.5" fill="#38bdf8"/>
  <circle cx="1087" cy="748" r="5.5" fill="#38bdf8"/>
