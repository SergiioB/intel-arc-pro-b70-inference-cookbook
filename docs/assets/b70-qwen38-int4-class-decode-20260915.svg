  <!-- vLLM GPTQ-Int4: 75.6 / 71.6 / 61.2 / 52.4 / 49.8 / 45.7@98K / 32.6@128K / 34.5@196K ; ceiling ~204K -->
  <polyline fill="none" stroke="#fb923c" stroke-width="3.5" stroke-linejoin="round"
