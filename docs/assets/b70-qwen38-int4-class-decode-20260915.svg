<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1480" width="1600" height="1480" role="img" aria-labelledby="t d">
 <title id="t">Qwen3.8-27B INT4-class decode vs context — ARC Pro B70, same weight class, 8-bit KV</title>
 <desc id="d">Decode tokens per second against context length for the three engines on the same Int4/Q4 weight class, one card each, 8-bit KV cache.</desc>
 <style>
  .ax{stroke:#334155;stroke-width:1.5} .tick{stroke:#475569;stroke-width:1}
  .lbl{fill:#94a3b8;font-family:Geist Mono,ui-monospace,monospace;font-size:14px;text-anchor:middle}
  .vt{fill:#f1f5f9;font-family:Geist Mono,ui-monospace,monospace;font-size:17px;font-weight:600;text-anchor:end}
  .val{fill:#e2e8f0;font-family:Geist Mono,ui-monospace,monospace;font-size:14px;text-anchor:middle}
  .cap{fill:#64748b;font-family:Geist Mono,ui-monospace,monospace;font-size:13px;text-anchor:start}
  .title{fill:#f8fafc;font-family:Segoe UI,Inter,sans-serif;font-size:30px;font-weight:600}
  .sub{fill:#94a3b8;font-family:Segoe UI,Inter,sans-serif;font-size:16px}
  .h{fill:#e2e8f0;font-family:Segoe UI,Inter,sans-serif;font-size:17px;font-weight:600}
  .body{fill:#cbd5e1;font-family:Segoe UI,Inter,sans-serif;font-size:15px}
  .lg{fill:#cbd5e1;font-family:Segoe UI,Inter,sans-serif;font-size:13.5px}
  .warn{fill:#fbbf24}
 </style>

 <text x="45" y="62" class="title">Qwen3.8-27B · INT4 class decode vs context</text>
 <text x="45" y="92" class="sub">Same weight class on one Intel Arc Pro B70 each · 8-bit KV (vLLM fp8 / llama q8_0 / OV u8) · single-stream, median post-first-token</text>

 <g>
  <rect x="45" y="112" width="1510" height="60" fill="#0f172a" stroke="#334155"/>
  <text x="60" y="134" class="body">⏱ TIME TO SERVE (cold start): vLLM ≈3 min (graph capture)  ·  llama.cpp ≈40 s  ·  OpenVINO ≈90 s</text>
  <text x="60" y="159" class="body">Weights: vLLM GPTQ-Int4 sym-G128 19 GB · llama UD-Q4_K_M 16.5 GB · OV INT4-GDN8 21 GB (GDN float). OV has no MTP draft unit yet.</text>
 </g>

 <g>
