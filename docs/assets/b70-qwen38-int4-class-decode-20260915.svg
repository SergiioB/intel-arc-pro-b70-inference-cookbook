  <text x="1339" y="958" class="lbl">98K</text>
  <text x="1402" y="958" class="lbl">128K</text>
  <text x="1497" y="958" class="lbl">196K</text>
  <text x="1560" y="958" class="lbl">256K</text>
  <line x1="140" y1="920" x2="140" y2="925" class="tick"/>
  <line x1="450" y1="920" x2="450" y2="925" class="tick"/>
  <line x1="766" y1="920" x2="766" y2="925" class="tick"/>
