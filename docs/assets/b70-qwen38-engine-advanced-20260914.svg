 <text x="110" y="1040" fill="#c9d8f0" font-size="14" font-weight="600" font-family="Segoe UI, Inter, sans-serif">POWER (steady-state energy counter, both cards 230W cap in v2)</text>
 <text x="110" y="1062" fill="#8fa3c0" font-size="13" font-family="Segoe UI, Inter, sans-serif">vLLM 194–229 W · OV 202–211 W · llama.cpp 149.5 W at 150W cap (decode not power-bound: 15.2 at 230W; prefill +23% unlocked)</text>
 <text x="110" y="1092" fill="#c9d8f0" font-size="14" font-weight="600" font-family="Segoe UI, Inter, sans-serif">WHY vLLM LEADS</text>
 <text x="110" y="1114" fill="#8fa3c0" font-size="13" font-family="Segoe UI, Inter, sans-serif">GPTQ-Int4 weights = ~half the memory traffic of OV int8 per layer, fp8 KV halves it again; vLLM chunked prefill (8192) keeps TTFT linear while OV prefill rate decays with length.</text>
 <text x="110" y="1134" fill="#8fa3c0" font-size="13" font-family="Segoe UI, Inter, sans-serif">OV's edge is int8-weights fidelity + MTP parity everywhere ≤32K; its ceiling issues (compressed-KV decode &gt;98K, draft-KV u8 defect) are documented upstream-filable defects.</text>
 <text x="110" y="1154" fill="#5c7099" font-size="12" font-family="Segoe UI, Inter, sans-serif">Remaining asymmetry: OV=int8 weights vs vLLM=Int4 (int8 rerun pending) · llama.cpp untested with draft-MTP · v1 numbers superseded · B70-DOCS qw38-ov-mtp-20260914 ctx-sweep-vllm-v2.json</text>
