 <text x="110" y="1062" fill="#8fa3c0" font-size="13" font-family="Segoe UI, Inter, sans-serif">OpenVINO 202–211 W @230W cap (GPU.1) · vLLM ~149 W @150W cap · llama.cpp 149.5 W @150W cap (n=53 samples) — vLLM/llama at the cap; llama decode NOT power-bound (flat 15.2 at 230W)</text>
 <text x="110" y="1092" fill="#c9d8f0" font-size="14" font-weight="600" font-family="Segoe UI, Inter, sans-serif">WHY THE CURVES DIFFER</text>
 <text x="110" y="1114" fill="#8fa3c0" font-size="13" font-family="Segoe UI, Inter, sans-serif">OV MTP verify window batches 5 drafts/step on Xe2 → 3.3–3.7x no-MTP; holds ≥50 tok/s to 8K. vLLM MTP4 acceptance collapses as GPTQ-Int4 draft drifts from fp8-KV main at length (58→0.8).</text>
 <text x="110" y="1134" fill="#8fa3c0" font-size="13" font-family="Segoe UI, Inter, sans-serif">llama.cpp Q8_0: 27 GB weights leave tiny KV headroom but flat ~14 tok/s at every length — no speculative path engaged, decode bound by dense 27B step time, not attention.</text>
 <text x="110" y="1154" fill="#5c7099" font-size="12" font-family="Segoe UI, Inter, sans-serif">vLLM XPU graph A/B: on +8.7% @512 / +1.8% @8K — collapse is not graph-driven · Source: B70-DOCS qw38-ov-mtp-20260914 · cookbook ENGINE-COMPARISON-CTX-20260914.md</text>
