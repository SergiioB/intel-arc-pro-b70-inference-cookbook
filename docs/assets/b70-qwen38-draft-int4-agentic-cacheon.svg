<text x="1320" y="616" fill="#f5f8fc" font-size="17" font-weight="700" text-anchor="start">56.20  +25.4%</text>
<text x="82" y="676" fill="#9caec4" font-size="16" font-weight="500" text-anchor="start">96K (thin, 2 turns): 40.66 vs 47.85 (+17.7%). ~128K t1 n=1: cookbook 43.82 vs S+M1 37.48 (−14.5%) — do not headline.</text>
<text x="82" y="708" fill="#9caec4" font-size="15" font-weight="500" text-anchor="start">Scale: 8K S+M1 66.99 = full orange bar. Isolated C1 after-load 825 / 816 MiB on the 32K–128K ladder.</text>
<rect x="48" y="816" width="1504" height="220" rx="28" fill="#0f1d30"/>
<text x="82" y="860" fill="#55d6be" font-size="15" font-weight="700" text-anchor="start">LABELS</text>
<text x="82" y="898" fill="#9caec4" font-size="16" font-weight="500" text-anchor="start">Prefix cache on (server logs). t1 hits=0; follow-ups 29952 / 63232 / 96512. Short t5 hits=1664.</text>
<text x="82" y="932" fill="#9caec4" font-size="16" font-weight="500" text-anchor="start">After-load 816–871 MiB — isolated C1, not a serving-capacity claim.</text>
<text x="82" y="966" fill="#ff7a7a" font-size="16" font-weight="600" text-anchor="start">Do not mix with cache-off agentic. Do not mix this 128K t1 with synthetic cache-off 62.52 n=5.</text>
<text x="82" y="1000" fill="#f5f8fc" font-size="16" font-weight="600" text-anchor="start">Do not overwrite LMX 83.7. Synthetic cache-off overlay remains 112.65 vs 81.20.</text>
