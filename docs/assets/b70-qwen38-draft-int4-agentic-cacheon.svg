<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
<title id="title">Qwen3.8-27B prefix-on agentic: cookbook BF16 draft vs draft-INT4 S+M1 through 64K</title>
<desc id="desc">C1 client post-first medians with prefix caching on. Isolated C1 after-load VRAM. 96K thin. 128K is a single cold turn where S+M1 is slower. Not mixed with cache-off agentic or the 83.7 LMX row. E2 self-reported.</desc>
<rect width="1600" height="1080" fill="#07111f"/>
<style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-variant-numeric:tabular-nums}</style>
