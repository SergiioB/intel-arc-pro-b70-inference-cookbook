<text x="58" y="88" fill="#f5f8fc" font-size="32" font-weight="750" text-anchor="start">INT4 draft wins coding sessions through 64K</text>
<text x="58" y="122" fill="#9caec4" font-size="16" font-weight="500" text-anchor="start">vLLM 0.27.2rc1.dev77+gac7509e2b · MTP4 · 230 W cap · client post-first · matched_except_quant · E2</text>
<rect x="48" y="148" width="1504" height="640" rx="28" fill="#0f1d30"/>
