 <text x="1230" y="340" fill="#81c9ff" font-size="13" font-family="Segoe UI, Inter, sans-serif">OV with MTP5 survives 64K (775 t/s); 98K → GPU event error (ceiling)</text>

 <text x="60" y="742" fill="#c9d8f0" font-size="17" font-weight="600" font-family="Segoe UI, Inter, sans-serif">READING</text>
 <g fill="#8fa3c0" font-size="13.5" font-family="Segoe UI, Inter, sans-serif">
  <text x="110" y="772">Prefill in the INT4 class: vLLM and OV tie ~1500-1750 at short input; vLLM holds longer (895 @96K).</text>
  <text x="110" y="796">llama.cpp cold prefill is 210-250 t/s flat — unchanged from Q8_0 (~230). Its lane is decode, not prefill (see decode chart).</text>
  <text x="110" y="820">The llama Q4 sweep TTFTs (28K-113K t/s) were prompt-cache hits; a --no-cache-prompt cold re-run is the honest row.</text>
  <text x="110" y="844">OV INT4-GDN8 prefill with the grafted MTP5 head: short-input ~1267-1592, decays like vLLM at length. 98K is the ceiling (GPU event error).</text>
 </g>
