 <text x="60" y="930" fill="#c9d8f0" font-size="17" font-weight="600" font-family="Segoe UI, Inter, sans-serif">FP8 TP2 · 2× B70 · full 8-bit weights, measured v2 protocol</text>
 <g fill="#8fa3c0" font-size="13.5" font-family="Segoe UI, Inter, sans-serif">
  <text x="110" y="956">73.0 → 57.3 tok/s decode across 512→96K — the only configuration with NO context decay: prefill holds 1019–1392 across the whole sweep.</text>
  <text x="110" y="980">30.9 GB of FP8 weights need two cards (one B70 has 30.3 GiB) — this lane is the price of full-weight-fidelity serving.</text>
  <text x="110" y="1004">Cold start 306 s (two-card compile + graph capture). Draw 416–458 W total for both cards.</text>
  <text x="110" y="1028">Banked E2 cells from earlier work (53.4 @p512, 60.1 @p1024, 33.5 @p2048 hybrid) are superseded by this same-protocol sweep.</text>
