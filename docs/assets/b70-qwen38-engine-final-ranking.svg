 <!-- MEASUREMENT LEDGER -->
 <text x="60" y="896" fill="#c9d8f0" font-size="17" font-weight="600" font-family="Segoe UI, Inter, sans-serif">MEASUREMENT LEDGER — 5 defects found and fixed during the audit</text>
 <g fill="#8fa3c0" font-size="13.5" font-family="Segoe UI, Inter, sans-serif">
  <text x="110" y="922">1. vLLM decode was tokens/wall incl. TTFT → true 75.6 (not 58.1) @512; the "context collapse" was this bug — v2 rerun, single streaming request</text>
  <text x="110" y="946">2. Power counters read the idle card on vLLM/llama arms → corrected PCI per card; true load draws 99–229 W</text>
  <text x="110" y="970">3. Cap asymmetry (vLLM/llama at 150W default vs OV 230W) → all arms rerun at 230 W</text>
  <text x="110" y="994">4. Stale v1 numbers in doc/chart/catalog → pinned to archived v2 JSONs; 30/30 doc numbers trace to raw files</text>
  <text x="110" y="1018">5. llama+MTP prefill column cache-poisoned (prompt reuse) → marked INVALID; decode rows clean; cold-prefill rerun queued</text>
 </g>

 <!-- POWER -->
 <text x="60" y="1070" fill="#c9d8f0" font-size="17" font-weight="600" font-family="Segoe UI, Inter, sans-serif">POWER (steady-state energy counter, 230 W caps)</text>
 <g fill="#8fa3c0" font-size="13.5" font-family="Segoe UI, Inter, sans-serif">
  <text x="110" y="1096">vLLM 194–229 W · OpenVINO 202–211 W · llama+draft-MTP 99–103 W · llama no-spec 149.5 W (at its 150W cap; decode cap-insensitive)</text>
  <text x="110" y="1120">Efficiency pick: llama+MTP — lowest watts per token (38–52 tok/s at ~100 W)</text>
 </g>

