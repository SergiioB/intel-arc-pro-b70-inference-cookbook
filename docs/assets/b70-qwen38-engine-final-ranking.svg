 <title id="t">Qwen3.8-27B on one B70 per engine: decode vs context, all levers enabled, 2026-09-14</title>
 <desc id="d">Decode tok/s 512 to 64K: vLLM Int4-MTP4 75.6 71.6 61.2 52.4 49.8; OV int8-MTP5 62.1 56.5 50.8 41.3 25.0; llama Q8_0 draft-MTP 52.0 51.2 49.6 44.0 38.3; llama no-spec flat 14.0. Y axis 0-80, all points inside.</desc>
