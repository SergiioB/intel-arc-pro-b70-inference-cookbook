 <!-- ===== BOTTOM: ledger, power, asymmetries ===== -->
 <text x="60" y="716" fill="#c9d8f0" font-size="17" font-weight="600" font-family="Segoe UI, Inter, sans-serif">MEASUREMENT LEDGER — 5 defects found and fixed during the audit</text>
 <g fill="#8fa3c0" font-size="13.5" font-family="Segoe UI, Inter, sans-serif">
  <text x="110" y="742">1. vLLM decode was tokens/wall incl. TTFT → true 75.6 (not 58.1) @512; the "context collapse" was this bug — v2 rerun, single streaming request</text>
  <text x="110" y="766">2. Power counters read the idle card on vLLM/llama arms → corrected PCI per card; true load draws 99–229 W</text>
  <text x="110" y="790">3. Cap asymmetry (vLLM/llama at 150W default vs OV 230W) → all arms rerun at 230 W</text>
  <text x="110" y="814">4. Stale v1 numbers in doc/chart/catalog → all pinned to archived v2 JSONs; 30/30 doc numbers trace to raw files</text>
  <text x="110" y="838">5. llama+MTP prefill column cache-poisoned (prompt reuse) → marked INVALID; decode rows clean; cold-prefill rerun queued</text>
 </g>

 <text x="60" y="890" fill="#c9d8f0" font-size="17" font-weight="600" font-family="Segoe UI, Inter, sans-serif">POWER (steady-state energy counter, 230 W caps)</text>
 <g fill="#8fa3c0" font-size="13.5" font-family="Segoe UI, Inter, sans-serif">
  <text x="110" y="916">vLLM 194–229 W · OpenVINO 202–211 W · llama+draft-MTP 99–103 W · llama no-spec 149.5 W (at its 150W cap; decode cap-insensitive)</text>
  <text x="110" y="940">Efficiency pick: llama+MTP — lowest watts per token (38–52 tok/s at ~100 W)</text>
 </g>

 <text x="60" y="992" fill="#c9d8f0" font-size="17" font-weight="600" font-family="Segoe UI, Inter, sans-serif">REMAINING ASYMMETRIES (labeled, not hidden)</text>
 <g fill="#8fa3c0" font-size="13.5" font-family="Segoe UI, Inter, sans-serif">
  <text x="110" y="1018">Weights differ: OV int8 25.8 GB · vLLM GPTQ-Int4 19 GB · llama Q8_0 27 GB — same model family, different compression (int8-vLLM rerun pending)</text>
  <text x="110" y="1042">llama+MTP: prefill unmeasured (cache bug), 96K untested, acceptance measured on counting task</text>
  <text x="110" y="1066">OV 64K/96K points are n=1–2 ceiling probes (provisional); all other points n=3</text>
  <text x="110" y="1090">Context ceilings: vLLM config max 100K · OV 96K (131K blocked: VRAM f16 / compressed-KV decode defect) · llama 128K init-crash (27 GB + KV &gt; 32 GB)</text>
 </g>

 <text x="60" y="1150" fill="#5c7099" font-size="12" font-family="Segoe UI, Inter, sans-serif">Source: B70-DOCS qw38-ov-mtp-20260914 · ctx-sweep-vllm-v2.json · ctx-sweep-llamacpp-mtp.json · ctx-sweep-openvino.json · cookbook ENGINE-COMPARISON-CTX-20260914.md</text>
