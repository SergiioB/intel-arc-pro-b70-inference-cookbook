 <text x="110" y="724" fill="#8fa3c0" font-size="13" font-family="Segoe UI, Inter, sans-serif">llama.cpp's "flat 14" was a config choice, not an engine limit: native MTP tensors in the same Q8_0 file give 2.7-3.7x. The earlier all-lengths ranking stands, with llama-MTP now ahead of OV from 32K.</text>

 <!-- what changed / caveats -->
 <text x="60" y="780" fill="#c9d8f0" font-size="17" font-weight="600" font-family="Segoe UI, Inter, sans-serif">MEASUREMENT LEDGER (what the audit fixed tonight)</text>
 <g fill="#8fa3c0" font-size="13.5" font-family="Segoe UI, Inter, sans-serif">
  <text x="110" y="806">1. vLLM decode was tokens/wall including TTFT → real decode 75.6 not 58.1 @512; the "context collapse" was the bug (fixed, v2 rerun)</text>
  <text x="110" y="830">2. Power counters read the idle card for vLLM/llama arms → true draws 149-229W under load (fixed, correct PCI per card)</text>
  <text x="110" y="854">3. Cap asymmetry: vLLM/llama first ran at 150W default while OV had 230W → all arms rerun at 230W (fixed)</text>
  <text x="110" y="878">4. Doc/chart/catalog stale numbers (v1 "3.4 @32K", "78.2 @512") → pinned to archived v2 JSONs; llama JSON watt rows labeled known-bad</text>
  <text x="110" y="902">5. llama+MTP prefill column INVALID (server prompt-cache hits, 88K t/s artifacts) → decode-only until cold-prefill rerun; llama no-spec prefill was 150W-capped (+23% at 230W)</text>
 </g>

 <!-- power -->
 <text x="60" y="960" fill="#c9d8f0" font-size="17" font-weight="600" font-family="Segoe UI, Inter, sans-serif">POWER (steady-state energy counter, 230W caps)</text>
 <g fill="#8fa3c0" font-size="13.5" font-family="Segoe UI, Inter, sans-serif">
  <text x="110" y="986">vLLM 194–229 W · OV 202–211 W · llama+MTP 99–103 W · llama no-spec 149.5 W @150W cap</text>
  <text x="110" y="1010">llama+MTP is the efficiency pick: ~100 W for 38-52 tok/s — lowest watts per token of all four configs</text>
 </g>

 <!-- remaining asymmetries -->
 <text x="60" y="1060" fill="#c9d8f0" font-size="17" font-weight="600" font-family="Segoe UI, Inter, sans-serif">REMAINING ASYMMETRIES (honest)</text>
 <g fill="#8fa3c0" font-size="13.5" font-family="Segoe UI, Inter, sans-serif">
  <text x="110" y="1086">Weights: OV int8 (25.8 GB) vs vLLM GPTQ-Int4 (19 GB) vs llama Q8_0 (27 GB) — same-family model, different compression; int8-vLLM rerun pending</text>
  <text x="110" y="1110">llama+MTP: prefill unmeasured (cache-hit bug in this run); 96K untested; acceptance on prose tasks may differ from counting task</text>
  <text x="110" y="1134">OV 64K/96K points are n=1-2 ceiling probes (marked provisional in doc); llama+MTP 512-64K are n=3</text>
 </g>
