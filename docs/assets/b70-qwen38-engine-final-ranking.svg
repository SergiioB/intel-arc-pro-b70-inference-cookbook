  <text x="110" y="1130">vLLM 96K verified on the 1-card Int4 arm; llama+MTP 96K untested; OV 96K via no-MTP u4/f16</text>
  <text x="110" y="1154">llama-draftMTP prefill measured separately (see prefill chart); llama no-spec 128K init-crash (weights + KV &gt; 32 GB)</text>
