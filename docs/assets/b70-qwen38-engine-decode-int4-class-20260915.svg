 <title id="t">Qwen3.8-27B INT4 class decode vs context — ARC Pro B70, same weight class, 2026-09-15, full data</title>
 <desc id="d">Decode tok/s at 512..256K on one B70 each. vLLM Int4 MTP4: 75.6..34.5 (ceiling ~204K). llama Q4+MTP: 37.8..15.9 (holds 256K). OV MTP5 (u8): 79.5..29.1 (speed, ≤64K). OV no-MTP u4: 14.7..11.3 (context, holds 256K).</desc>
