 <text x="820" y="764" fill="#8fa3c0" font-size="14" font-family="Segoe UI, Inter, sans-serif" text-anchor="middle">input context length (tokens), log-ish placement</text>
 <g font-size="14" font-family="Segoe UI, Inter, sans-serif">
  <rect x="130" y="96" width="14" height="14" fill="#e8a87c"/><text x="152" y="108" fill="#c9d8f0">vLLM XPU · GPTQ-Int4 · MTP4 · fp8 KV · 19 GB</text>
  <rect x="490" y="96" width="14" height="14" fill="#7d9b76"/><text x="512" y="108" fill="#c9d8f0">llama.cpp SYCL · UD-Q4_K_M + MTP · q8_0 KV · 16.5 GB</text>
  <rect x="950" y="96" width="14" height="14" fill="#81c9ff"/><text x="972" y="108" fill="#c9d8f0">OpenVINO INT4-GDN8 · solid MTP5 u8 (speed) · dashed no-MTP u4 (context)</text>
 </g>
 <text x="60" y="800" fill="#fbbf24" font-size="14" font-weight="600" font-family="Segoe UI, Inter, sans-serif">INT4 CLASS FINAL — SAME WEIGHT CLASS, ONE CARD EACH, FULL MAX-CONTEXT DATA:</text>
 <g fill="#8fa3c0" font-size="13" font-family="Segoe UI, Inter, sans-serif">
  <text x="76" y="826">OpenVINO, fixed with u4 KV + cache_size=0, now HOLDS 256K like llama (11.3 t/s) — the u8/draft 64-98K ceiling was KV precision, not the card.</text>
  <text x="76" y="850">Speed vs context arms: OV MTP5 wins ≤64K (79.5 @512, best single-card decode in the class); swap to no-MTP u4 for 98K-256K.</text>
  <text x="76" y="874">llama Q4+MTP: the all-context king — 37.8 → 15.9 across the full 256K with the MTP draft ON the whole way, 16.5 GB weights, ~155 W.</text>
  <text x="76" y="898">vLLM Int4 MTP4: fastest all-rounder to ~200K (75.6 → 34.5 @196K) but 256K rejected by vLLM itself — KV budget, not the card (9.33 GiB vs 7.47 free).</text>
  <text x="76" y="922">Every engine fits its max context on one B70 except vLLM's 256K — and even that is a software KV-budget limit, not VRAM exhaustion.</text>
 </g>
 <text x="60" y="962" fill="#5c7099" font-size="13" font-family="Segoe UI, Inter, sans-serif">Dashed OV squares = no-MTP u4 with cache_size=0. MTP5 u8 collapses ~4.7 t/s @98K (verifier window) — MTP is a short-context speed arm only.</text>
 <text x="60" y="1006" fill="#5c7099" font-size="12" font-family="Segoe UI, Inter, sans-serif">Power (energy counter): vLLM ~228 W · llama ~155 W · OV MTP5 ~205 W · OV u4 ~215 W @230W cap — none power-limited at C1. Source: B70-DOCS qw38-ov-mtp-20260914/</text>
</svg>