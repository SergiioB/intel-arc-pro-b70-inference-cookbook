 <text x="60" y="800" fill="#fbbf24" font-size="14" font-weight="600" font-family="Segoe UI, Inter, sans-serif">INT4 CLASS AFTER THE MTP GRAFT — OV IS NOW EQUAL:</text>
 <g fill="#8fa3c0" font-size="13" font-family="Segoe UI, Inter, sans-serif">
  <text x="76" y="824">OpenVINO jumped 22.4 → 79.5 @512 (+3.55×) with the Intel Hub int4-ov MTP head grafted into the GDN8 export — correct output, realistic 79.5/73.0 vs vLLM MTP4 75.6/71.6.</text>
  <text x="76" y="848">llama Q4+MTP 37.8 vs stale Q8 no-spec 14.0 — 2.7× faster: 16.5 GB fits + native MTP draft. Q8 lane had no draft unit.</text>
  <text x="76" y="872">The prior no-draft 22.4 line is the dashed baseline. Without an MTP head OpenVINO cannot compete in this class; with one it leads at 512.</text>
  <text x="76" y="896">Ceilings: OV MTP5 survives 64K (29.1, no-draft crashed) but dies at 98K (GPU event wait). vLLM caps ≈204K (KV budget). llama alone holds 256K.</text>
 </g>
 <text x="60" y="950" fill="#5c7099" font-size="13" font-family="Segoe UI, Inter, sans-serif">Open circles = n=1 ceiling probes (98K+); · vLLM 262K rejected by vLLM itself: 256K needs 9.33 GiB KV vs 7.47 GiB free on one card → ceiling ≈204K</text>
 <text x="60" y="1000" fill="#5c7099" font-size="12" font-family="Segoe UI, Inter, sans-serif">Power (energy counter): vLLM ~228 W · llama ~155 W · OV MTP5 ~205 W @230W cap — none power-limited at C1. Source: B70-DOCS qw38-ov-mtp-20260914 ctx-sweep-{vllm-v2,llamacpp-q4km-mtp,ov-int4-gdn8,ov-int4-gdn8-mtp5}.json + vllm-int4-262k-probe.json</text>
