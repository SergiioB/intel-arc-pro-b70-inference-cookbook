<line x1="78" y1="862" x2="1522" y2="862" stroke="#26364a" stroke-width="2"/>
<text x="78" y="902" class="foot" text-anchor="start">Resident session: exact 120,000-token preparation + five changed ~120,148-token follow-ups.</text>
<text x="78" y="932" class="foot" text-anchor="start">Cache-on reused 118,592–119,680 tokens; cache-off used the explicit negative flag and reused 0.</text>
<text x="1522" y="902" class="foot" text-anchor="end">Intel Arc Pro B70 32 GB · vLLM XPU</text>
<text x="1522" y="932" class="foot" text-anchor="end">C1 · n=5</text>
