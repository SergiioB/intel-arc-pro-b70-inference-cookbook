<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Intel Arc Pro B70 exact 128K cache and speculative decoding matrix</title>
<desc id="desc">Eight matched rows compare no speculative decoding, MTP1, MTP2, and MTP4 with prefix caching on and off for cold exact 128K and resident 120K Pi sessions.</desc>
<style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.title{font-size:52px;font-weight:760;fill:#f8fafc;letter-spacing:-1.4px}
.subtitle{font-size:23px;font-weight:450;fill:#a9b7c9}
.kicker{font-size:17px;font-weight:700;fill:#4fd1c5;letter-spacing:2px}
.head{font-size:17px;font-weight:700;fill:#a9b7c9;letter-spacing:.3px}
.body{font-size:23px;font-weight:560;fill:#f8fafc}
.muted{font-size:19px;font-weight:500;fill:#a9b7c9}
.best{font-size:23px;font-weight:760;fill:#86efac}
.pill{font-size:16px;font-weight:760;fill:#08111f;letter-spacing:.7px}
.foot{font-size:17px;font-weight:480;fill:#a9b7c9}
</style>
<rect width="1600" height="1000" fill="#08111f"/>
<rect x="42" y="42" width="1516" height="916" rx="26" fill="#101c2d"/>
<text x="78" y="96" class="kicker" text-anchor="start">REAL-WORLD PI · MATCHED C1 MATRIX</text>
<text x="78" y="158" class="title" text-anchor="start">What cache + MTP change at exact 128K</text>
<text x="78" y="202" class="subtitle" text-anchor="start">Same image, model, prompts, p130944/g128, scheduler budget 8192 · median of 5 measured requests</text>
<rect x="68" y="232" width="1464" height="58" rx="12" fill="#16243a"/>
<text x="88" y="268" class="head" text-anchor="start">Mode</text>
<text x="245" y="268" class="head" text-anchor="start">Cache</text>
<text x="415" y="258" class="head" text-anchor="middle">Cold TTFC</text>
<text x="415" y="280" class="muted" text-anchor="middle">lower is better</text>
<text x="650" y="258" class="head" text-anchor="middle">Cold output</text>
<text x="650" y="280" class="muted" text-anchor="middle">tok/s after first</text>
<text x="885" y="258" class="head" text-anchor="middle">Resident TTFC</text>
<text x="885" y="280" class="muted" text-anchor="middle">lower is better</text>
<text x="1125" y="258" class="head" text-anchor="middle">Resident E2E</text>
<text x="1125" y="280" class="muted" text-anchor="middle">lower is better</text>
<text x="1390" y="258" class="head" text-anchor="middle">Resident reuse</text>
<text x="1390" y="280" class="muted" text-anchor="middle">tokens</text>
