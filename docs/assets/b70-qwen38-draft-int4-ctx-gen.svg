<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
<title id="title">Qwen3.8-27B draft-INT4 S+M1 generation curve and isolated-C1 128K ladder on Intel Arc Pro B70</title>
<desc id="desc">C1 client post-first medians n=5, cache-off, 230 W configured cap. Generation curve at p512 and p8192. Long-context g128 ladder is isolated C1 at 870 MiB free after load, not a serving config. Reused Lane 1 g128 112.65 / 103.63. E2 self-reported.</desc>
