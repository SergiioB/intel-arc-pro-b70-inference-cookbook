<text x="78" y="1046" fill="#f5f8fc" font-size="16" font-weight="600" text-anchor="start">Default public recipe remains BF16-draft MTP4 83.7 (LMX cmsur82fz06svms01ga1f0z83). Do not overwrite that row.</text>
<text x="78" y="1082" fill="#9caec4" font-size="15" font-weight="500" text-anchor="start">Timing is client post-first, not llama-bench tg. Cold input is prompt tokens / TTFT, not isolated prefill.</text>
