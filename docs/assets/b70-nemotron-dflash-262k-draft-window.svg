<text x="60" y="824" fill="#5c7099" font-size="13" font-family="Segoe UI, Inter, sans-serif">Higher acceptance is NOT faster: n=3 accepts 74-78% vs n=7 at 60-63%, yet n=7 is 33-57% faster</text>
<text x="60" y="848" fill="#5c7099" font-size="13" font-family="Segoe UI, Inter, sans-serif">The window optimum does NOT shift with context length - n=7 is correct at 512 and at 250K alike</text>
<text x="60" y="872" fill="#5c7099" font-size="13" font-family="Segoe UI, Inter, sans-serif">A step costs the same whether it carries 3 drafts or 7, so tokens-per-step (not hit rate) sets throughput</text>
