 <text x="420" y="188" fill="#c792ea" font-size="12" font-family="Segoe UI, Inter, sans-serif" text-anchor="middle">FP8 TP2 prefill peaks 1736 @1K — beats every 1-card arm</text>

 <!-- outcome notes -->
 <text x="620" y="480" fill="#f2c9a0" font-size="13.5" font-family="Segoe UI, Inter, sans-serif">vLLM chunked prefill (8192) holds rate: +39% over OV at 64K, +53% at 96K</text>
 <text x="620" y="502" fill="#a5dcff" font-size="13" font-family="Segoe UI, Inter, sans-serif">OV leads ≤2K (1815 peak at 2K), then decays with length</text>
 <text x="180" y="560" fill="#8fb98a" font-size="12.5" font-family="Segoe UI, Inter, sans-serif">llama.cpp: decode-oriented engine — prefill is not its lane</text>
 <text x="440" y="300" fill="#c792ea" font-size="12.5" font-family="Segoe UI, Inter, sans-serif">FP8 TP2 = 2× B70 reference cells (synthetic prompts, MTP8) — not same class</text>

 <!-- footer -->
 <text x="60" y="760" fill="#c9d8f0" font-size="15" font-weight="600" font-family="Segoe UI, Inter, sans-serif">READING</text>
 <g fill="#8fa3c0" font-size="13.5" font-family="Segoe UI, Inter, sans-serif">
  <text x="110" y="786">Prefill is where vLLM's architecture pays: chunked 8192-token batches keep the GPU saturated as context grows — 1375 t/s at 32K vs OV's 1119.</text>
  <text x="110" y="810">OV peaks highest at short context (1815 @2K) but its rate decays ~2.7x from 2K to 96K; vLLM decays ~2x.</text>
  <text x="110" y="834">llama.cpp prefill is an order of magnitude behind on this hardware — its lane is decode simplicity, not prompt throughput.</text>
  <text x="110" y="858">FP8 TP2 reference: dual-card class only (30.9 GB weights don't fit one B70); cells shown are banked E2 evidence, not tonight's protocol.</text>
 </g>
 <text x="60" y="920" fill="#5c7099" font-size="12" font-family="Segoe UI, Inter, sans-serif">Source: B70-DOCS qw38-ov-mtp-20260914 ctx-sweep-{openvino,vllm-v2,llamacpp}.json · FP8-TP2-W8A16.md (banked E2) · llama+MTP prefill shown separately</text>
</svg>
