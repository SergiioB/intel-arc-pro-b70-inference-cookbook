<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
<title id="title">Qwen3.8-27B FP8 W8A16 dual B70 TP2 inference pipeline</title>
<desc id="desc">A process diagram for the public Qwen3.8-27B FP8 recipe. One C1 request enters vLLM, tensor-parallel workers are pinned to one Intel Arc Pro B70 each, oneCCL simple algorithms stage collectives through host memory because GPU peer-to-peer is unavailable, FP8 W8A16 target compute uses the Xe2 small-M decode path, and native MTP8 drafts are verified before streaming. The public evidence covers C1 only and is self-reported E2.</desc>
