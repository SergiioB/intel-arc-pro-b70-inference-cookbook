<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1560" viewBox="0 0 1600 1560" role="img" aria-labelledby="title desc">
<title id="title">Qwen3.8-Flash-Next C1 prefill and decode from 8K to 128K context</title>
<desc id="desc">Grouped bar charts, y-axis from zero. Prefill peaks at 16K then drops at 128K. Decode p512/g128 stays ~23 tok/s from 8K through 128K. After a 9k prompt, decode is 20.3 tok/s at 16K and 128K. F16 vs FP32 is GGML_SYCL_F16 (compile-time), not the GGUF. Weights mixed IQ3_S/IQ4_NL. C1 llama.cpp SYCL on two Intel Arc Pro B70 GPUs. 8K/16K/128K are context windows.</desc>
