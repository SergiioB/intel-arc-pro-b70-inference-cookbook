<rect x="88" y="1088" width="14" height="14" rx="3" fill="#68a7ff"/>
<text x="110" y="1100" fill="#9caec4" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif">F16 binary (GGML_SYCL_F16=ON)</text>
<rect x="360" y="1088" width="14" height="14" rx="3" fill="#55d6be"/>
<text x="382" y="1100" fill="#9caec4" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif">FP32 binary (GGML_SYCL_F16=OFF)</text>
<text x="680" y="1100" fill="#9caec4" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif">After a 9096-token prompt, decode is 20.3 tok/s at both 16K and 128K.</text>

<rect x="56" y="1228" width="1488" height="280" rx="28" fill="#0f1d30"/>
<text x="88" y="1272" fill="#f5f8fc" font-size="18" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">Qwen3.8-Flash-Next on 2× Intel Arc Pro B70. llama.cpp SYCL. One request.</text>
<text x="88" y="1308" fill="#9caec4" font-size="16" font-family="ui-sans-serif, system-ui, sans-serif">Same F16 server, 16K context: 20.3 tok/s decode, 594 tok/s prefill on a 9k prompt (n=5).</text>
<text x="88" y="1340" fill="#9caec4" font-size="16" font-family="ui-sans-serif, system-ui, sans-serif">128K also serves. Short-prompt decode stays ~23 tok/s from 8K through 128K. After a 9k prompt it stays ~20.3. Prefill peaks at 16K, then drops at 128K.</text>
<text x="88" y="1372" fill="#9caec4" font-size="16" font-family="ui-sans-serif, system-ui, sans-serif">F16 vs FP32 is not the GGUF. Weights are mixed IQ3_S / IQ4_NL. GGML_SYCL_F16 is a compile-time SYCL flag (two binaries). F16 wins prefill. FP32 is a bit faster on decode (23.4 at 8K).</text>
<text x="88" y="1412" fill="#f5f8fc" font-size="16" font-family="ui-sans-serif, system-ui, sans-serif">8K / 16K / 128K = context, not concurrency. Self-reported. n=3 screens on this chart; n=5 leaders on the card above.</text>
<text x="88" y="1476" fill="#64748b" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif">Recipe: github.com/SergiioB/intel-arc-pro-b70-inference-cookbook · docs/qwen38-flash-next/QWEN38-FLASH-NEXT-LLAMACPP.md</text>
</svg>
