<text x="56" y="108" fill="#f5f8fc" font-size="40" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">How speed changes with context</text>
<text x="56" y="148" fill="#9caec4" font-size="20" font-family="ui-sans-serif, system-ui, sans-serif">Single request (C1) · 8K → 16K → 128K context windows · y-axis starts at 0</text>

