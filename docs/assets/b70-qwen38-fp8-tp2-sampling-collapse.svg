<text x="82" y="1050" fill="#ffb45c" font-size="16" font-weight="600" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">Use the model-card cells as sampling-sensitivity diagnostics, not as natural-content quality results.</text>
<text x="82" y="1084" fill="#9caec4" font-size="16" font-weight="600" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">Greedy and model-card cells are separate sampling conditions on the same synthetic prompt class.</text>
<text x="82" y="1124" fill="#9caec4" font-size="14" font-weight="400" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">Source: public n5 JSON and sanitized model-card-sampling JSON; all cells C1, n=5, exact g128.</text>
