<text x="48" y="98" fill="#f5f8fc" font-size="36" font-weight="700" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">Sampling sensitivity: greedy versus model-card preset</text>
<text x="48" y="132" fill="#9caec4" font-size="18" font-weight="400" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">Same FP8 TP2 MTP8 stack · random-token synthetic prompts · C1 · n=5</text>
