<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" role="img" aria-labelledby="title desc">
<title id="title">Qwen3.8-27B FP8 TP2 sampling sensitivity on random-token prompts</title>
<desc id="desc">Paired p512/g128 and p1024/g128 C1 comparisons between greedy temperature zero diagnostics and the Qwen model-card non-thinking sampling preset. Client end-to-end output throughput and mean accepted speculative length both fall under the sampled random-token workload. Each point is a median or aggregate from five measured requests. This is not a natural-content quality evaluation.</desc>
