name: stale
on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 14
          days-before-close: 7
          only-issue-labels: "needs-info"
          stale-issue-message: |
            <!-- stale -->
            Still `needs-info` after 14 days. Reply with image sha + docker/serve line (and dmesg for hangs). Closes in 7 days if nothing new.
          stale-issue-label: "stale"
          exempt-issue-labels: "ready,confirmed,tp2-draft-block,driver-hang"
          days-before-pr-stale: -1
          days-before-pr-close: -1
          operations-per-run: 50
