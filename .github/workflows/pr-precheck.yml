name: pr-precheck

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  precheck:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate system map
        run: python3 scripts/check-repo.py
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const precheck = require('${{ github.workspace }}/.github/scripts/pr-precheck.js');
            await precheck({ github, context, core });
