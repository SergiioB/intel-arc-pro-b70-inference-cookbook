name: pr-precheck

on:
  pull_request:
    types: [opened, reopened, synchronize]
  # release-please.yml dispatches this on the release PR branch when GitHub
  # holds that PR's own pull_request run for approval.
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  precheck:
    # Release PRs carry only a version and changelog edit; ci.yml already runs
    # scripts/check-repo.py on them. Skipped runs (including dispatches, which
    # have no pull request context) report as neutral, never as a failure.
    if: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate system map
        run: python3 scripts/check-repo.py
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const precheck = require('${{ github.workspace }}/.github/scripts/pr-precheck.js');
            await precheck({ github, context, core });
