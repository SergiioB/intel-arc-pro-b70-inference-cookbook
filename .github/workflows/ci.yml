name: ci

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pinned dev tooling
        run: pip install -r dev-requirements.txt
      - name: Repository gates
        run: python3 scripts/check-repo.py
      - name: Tests with coverage
        run: |
          set -o pipefail
          pytest --cov --cov-fail-under=55 --durations=10 -n auto \
            --cov-report=term-missing --cov-report=xml tests/ 2>&1 | tee pytest-output.txt
      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage
          path: |
            coverage.xml
            pytest-output.txt
          if-no-files-found: warn

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dev tooling
        run: pip install -r dev-requirements.txt
      - name: Ruff lint
        run: ruff check scripts tests
      - name: Ruff format check
        run: ruff format --check scripts tests
      - name: Mypy strict
        run: mypy scripts tests
      - name: Dead code detection (vulture)
        run: vulture scripts tests --min-confidence 80

  duplicate-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy-paste detection
        run: npx --yes jscpd@latest --config .jscpd.json

  pr-summary:
    needs: [validate, lint]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            if (!context.issue.number) {
              core.info("Not a pull request; skipping summary.");
              return;
            }
            const { data: run } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const rows = run.jobs
              .filter((job) => job.name !== "pr-summary")
              .map((job) => `| ${job.name} | ${job.conclusion === "success" ? "pass" : (job.conclusion || "pending")} |`)
              .join("\n");
            const failed = run.jobs.some((job) => job.name !== "pr-summary" && job.conclusion && job.conclusion !== "success");
            const status = failed ? "FAILURES PRESENT" : "ALL PASS";
            const marker = "<!-- ci-pr-summary -->";
            const body = `${marker}\n## CI summary\n\nStatus: ${status}\n\n| Job | Result |\n|---|---|\n${rows}\n`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
