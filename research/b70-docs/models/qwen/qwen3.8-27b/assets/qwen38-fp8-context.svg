<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="qwen38-context-title qwen38-context-desc">
  <title id="qwen38-context-title">Qwen3.8-27B FP8 TP2 context scaling</title>
  <desc id="qwen38-context-desc">Log-scale C1 end-to-end output throughput from 512 tokens through a valid 240,000-token probe. The server declared a 262,144-token context and reported 603,082 KV tokens.</desc>
  <rect width="1200" height="660" fill="#07111f"/>
  <text x="60" y="54" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-variant-numeric="tabular-nums" font-weight="700">C1 rate falls as context fills</text><text x="60" y="88" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-variant-numeric="tabular-nums" >FP8 TP2 / MTP4 / compile-only · log axes · e2e output throughput</text><rect x="60" y="112" width="1080" height="1" rx="0" fill="#263a53" /><line x1="120" y1="480" x2="880" y2="480" stroke="#263a53" stroke-width="1" /><text x="102" y="485" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-variant-numeric="tabular-nums" text-anchor="end">0.1</text><line x1="120" y1="361.2159705291678" x2="880" y2="361.2159705291678" stroke="#263a53" stroke-width="1" /><text x="102" y="366.2159705291678" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-variant-numeric="tabular-nums" text-anchor="end">1</text><line x1="120" y1="242.4319410583356" x2="880" y2="242.4319410583356" stroke="#263a53" stroke-width="1" /><text x="102" y="247.4319410583356" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-variant-numeric="tabular-nums" text-anchor="end">10</text><line x1="120" y1="150" x2="880" y2="150" stroke="#263a53" stroke-width="1" /><text x="102" y="155" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-variant-numeric="tabular-nums" text-anchor="end">60</text><line x1="120" y1="150" x2="120" y2="480" stroke="#263a53" stroke-width="1" stroke-dasharray="4 6"/><text x="120" y="510" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-variant-numeric="tabular-nums" font-weight="700" text-anchor="middle">p512</text><line x1="291.3124869908049" y1="150" x2="291.3124869908049" y2="480" stroke="#263a53" stroke-width="1" stroke-dasharray="4 6"/><text x="291.3124869908049" y="510" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-variant-numeric="tabular-nums" font-weight="700" text-anchor="middle">p2048</text><line x1="462.6249739816099" y1="150" x2="462.6249739816099" y2="480" stroke="#263a53" stroke-width="1" stroke-dasharray="4 6"/><text x="462.6249739816099" y="510" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-variant-numeric="tabular-nums" font-weight="700" text-anchor="middle">p8192</text><line x1="880" y1="150" x2="880" y2="480" stroke="#263a53" stroke-width="1" stroke-dasharray="4 6"/><text x="880" y="510" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-variant-numeric="tabular-nums" font-weight="700" text-anchor="middle">240K</text><text x="30" y="315" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-variant-numeric="tabular-nums" text-anchor="middle" transform="rotate(-90 30 315)">e2e tok/s</text><text x="500" y="542" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-variant-numeric="tabular-nums" text-anchor="middle">actual endpoint input tokens · logarithmic scale</text><path d="M 120 165.17718654315888 L 291.3124869908049 176.94864966519054 L 462.6249739816099 216.71682867162446 L 880 449.910113345962" fill="none" stroke="#55d6be" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="120" cy="165.17718654315888" r="7" fill="#55d6be" stroke="#07111f" stroke-width="3"/><text x="120" y="148.17718654315888" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-variant-numeric="tabular-nums" font-weight="700" text-anchor="middle">44.71 tok/s</text><circle cx="291.3124869908049" cy="176.94864966519054" r="7" fill="#55d6be" stroke="#07111f" stroke-width="3"/><text x="291.3124869908049" y="159.94864966519054" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-variant-numeric="tabular-nums" font-weight="700" text-anchor="middle">35.59 tok/s</text><circle cx="462.6249739816099" cy="216.71682867162446" r="7" fill="#55d6be" stroke="#07111f" stroke-width="3"/><text x="462.6249739816099" y="199.71682867162446" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-variant-numeric="tabular-nums" font-weight="700" text-anchor="middle">16.46 tok/s</text><circle cx="880" cy="449.910113345962" r="7" fill="#55d6be" stroke="#07111f" stroke-width="3"/><text x="880" y="477.910113345962" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-variant-numeric="tabular-nums" font-weight="700" text-anchor="middle">0.179 tok/s</text><rect x="925" y="150" width="215" height="330" rx="16" fill="#0f1d30" stroke="#263a53"/><text x="950" y="188" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-variant-numeric="tabular-nums" font-weight="700">Context capacity</text><text x="950" y="232" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-variant-numeric="tabular-nums" letter-spacing="1">declared</text><text x="950" y="260" fill="#55d6be" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-variant-numeric="tabular-nums" font-weight="700">256K tokens</text><text x="950" y="300" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-variant-numeric="tabular-nums" letter-spacing="1">KV reported</text><text x="950" y="328" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-variant-numeric="tabular-nums" font-weight="700">603,082 tokens</text><text x="950" y="368" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-variant-numeric="tabular-nums" letter-spacing="1">maximum concurrency</text><text x="950" y="396" fill="#ffb45c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-variant-numeric="tabular-nums" font-weight="700">2.3×</text><text x="950" y="438" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-variant-numeric="tabular-nums" letter-spacing="1">valid probe</text><text x="950" y="464" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-variant-numeric="tabular-nums" font-weight="700">p240K · n=1</text><text x="60" y="560" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-variant-numeric="tabular-nums" >The exact p262016 attempt was excluded: the client tokenizer produced 282,403 tokens, above the 262,144-token server limit.</text><text x="60" y="600" fill="#ffb45c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-variant-numeric="tabular-nums" font-weight="700" letter-spacing="1">PROVISIONAL — NOT FOR PUBLIC HEADLINE</text>
</svg>
