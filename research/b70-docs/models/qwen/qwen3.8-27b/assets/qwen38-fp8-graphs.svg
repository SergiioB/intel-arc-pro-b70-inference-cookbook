nt-numeric="tabular-nums" font-weight="700">MTP1 full graph</text><text x="630" y="505" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-variant-numeric="tabular-nums" >full graph</text><text x="1098" y="489" fill="#55d6be" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-variant-numeric="tabular-nums" font-weight="700" text-anchor="end">28.36 tok/s</text><rect x="60" y="590" width="1080" height="82" rx="12" fill="#12243a" stroke="#263a53"/><text x="84" y="620" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-variant-numeric="tabular-nums" >MTP4 full graph deadlocked. PIECEWISE made one request work at 44.98 tok/s; compile-only reached</text><text x="84" y="646" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-variant-numeric="tabular-nums" >46.97 tok/s in a historical n=5 custom lane. Keep graph off for the current MTP4 recipe.</text>
