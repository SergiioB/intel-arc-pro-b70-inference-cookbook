UI,Arial,sans-serif" font-size="13" font-variant-numeric="tabular-nums" text-anchor="middle">accept 82.14%</text><rect x="464" y="317.15327974223493" width="118" height="172.84672025776507" rx="8" fill="#68a7ff" /><rect x="598" y="197.31457" width="118" height="292.68543" rx="8" fill="#55d6be" /><text x="523" y="305.15327974223493" fill="#68a7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-variant-numeric="tabular-nums" font-weight="700" text-anchor="middle">35.59</text><text x="657" y="185.31457" fill="#55d6be" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-variant-numeric="tabular-nums" font-weight="700" text-anchor="middle">60.26</text><text x="590" y="520" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-variant-numeric="tabular-nums" font-weight="700" text-anchor="middle">p2048</text><text x="590" y="544" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-variant-numeric="tabular-nums" text-anchor="middle">TTFT 1.49 s</text><text x="590" y="566" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-variant-numeric="tabular-nums" text-anchor="middle">accept 93.29%</text><rect x="770.6666666666667" y="410.0410366969088" width="118" height="79.95896330309117" rx="8" fill="#68a7ff" /><rect x="904.6666666666667" y="195.4362157142857" width="118" height="294.5637842857143" rx="8" fill="#55d6be" /><text x="829.6666666666667" y="398.0410366969088" fill="#68a7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-variant-numeric="tabular-nums" font-weight="700" text-anchor="middle">16.46</text><text x="963.6666666666667" y="183.4362157142857" fill="#55d6be" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-variant-numeric="tabular-nums" font-weight="700" text-anchor="middle">60.65</text><text x="896.6666666666667" y="520" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-variant-numeric="tabular-nums" font-weight="700" text-anchor="middle">p8192</text><text x="896.6666666666667" y="544" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-variant-numeric="tabular-nums" text-anchor="middle">TTFT 5.68 s</text><text x="896.6666666666667" y="566" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-variant-numeric="tabular-nums" text-anchor="middle">accept 96.56%</text><rect x="720" y="108" width="18" height="18" rx="4" fill="#68a7ff" /><text x="748" y="123" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-variant-numeric="tabular-nums" >e2e output rate</text><rect x="905" y="108" width="18" height="18" rx="4" fill="#55d6be" /><text x="933" y="123" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-variant-numeric="tabular-nums" >approx. post-first</text><text x="60" y="590" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-variant-numeric="tabular-nums" >The blue rate includes first-token delay. The teal rate is 1000 / mean TPOT and is a decode diagnostic, not the older custom lane statistic.</text><text x="60" y="620" fill="#ffb45c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-variant-numeric="tabular-nums" font-weight="700" letter-spacing="1">PROVISIONAL — NOT FOR PUBLIC HEADLINE</text>
</svg>
