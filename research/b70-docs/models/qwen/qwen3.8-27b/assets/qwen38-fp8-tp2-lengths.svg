<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="qwen38-lengths-title qwen38-lengths-desc">
  <title id="qwen38-lengths-title">Qwen3.8-27B FP8 TP2 prompt-length benchmark</title>
  <desc id="qwen38-lengths-desc">Three fresh n=3 C1 cells at 512, 2048, and 8192 input tokens. Blue bars are end-to-end output throughput. Teal bars are approximate post-first decode throughput.</desc>
  <rect width="1200" height="660" fill="#07111f"/>
