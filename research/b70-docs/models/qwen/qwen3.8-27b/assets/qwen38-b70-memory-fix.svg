<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="qwen38-memory-title qwen38-memory-desc">
  <title id="qwen38-memory-title">Dual-B70 host memory probe and workaround</title>
  <desc id="qwen38-memory-desc">A process exposing both GPUs showed about 10.97 GiB host overhead for 11.0 GiB of device allocation. Per-worker masks reduced the isolated probe overhead to 0.82 GiB across two workers.</desc>
  <rect width="1200" height="700" fill="#07111f"/>
  <text x="60" y="54" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-variant-numeric="tabular-nums" font-weight="700">Dual-B70 host-memory failure and the launch fix</text><text x="60" y="88" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-variant-numeric="tabular-nums" >Probe-level host overhead while allocating device memory</text><rect x="60" y="112" width="1080" height="1" rx="0" fill="#263a53" /><line x1="80" y1="470" x2="750" y2="470" stroke="#9caec4" stroke-width="1.5" /><text x="66" y="475" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-variant-numeric="tabular-nums" text-anchor="end">0</text><line x1="80" y1="420" x2="750" y2="420" stroke="#263a53" stroke-width="1" /><text x="66" y="425" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-variant-numeric="tabular-nums" text-anchor="end">2</text><line x1="80" y1="370" x2="750" y2="370" stroke="#263a53" stroke-width="1" /><text x="66" y="375" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-variant-numeric="tabular-nums" text-anchor="end">4</text><line x1="80" y1="320" x2="750" y2="320" stroke="#263a53" stroke-width="1" /><text x="66" y="325" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-variant-numeric="tabular-nums" text-anchor="end">6</text><line x1="80" y1="270" x2="750" y2="270" stroke="#263a53" stroke-width="1" /><text x="66" y="275" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-variant-numeric="tabular-nums" text-anchor="end">8</text><line x1="80" y1="220" x2="750" y2="220" stroke="#263a53" stroke-width="1" /><text x="66" y="225" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-variant-numeric="tabular-nums" text-anchor="end">10</text><line x1="80" y1="170" x2="750" y2="170" stroke="#263a53" stroke-width="1" /><text x="66" y="175" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-variant-numeric="tabular-nums" text-anchor="end">12</text><text x="28" y="320" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-variant-numeric="tabular-nums" text-anchor="middle" transform="rotate(-90 28 320)">host overhead GiB</text><rect x="135.66666666666669" y="195.75" width="112" height="274.25" rx="8" fill="#ff7b8a" /><text x="191.66666666666669" y="181.75" fill="#ff7b8a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-variant-numeric="tabular-nums" font-weight="700" text-anchor="middle">10.97 GiB</text><text x="191.66666666666669" y="500" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-variant-numeric="tabular-nums" font-weight="700" text-anchor="middle">both GPUs</text><text x="191.66666666666669" y="522" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-variant-numeric="tabular-nums" text-anchor="middle">VRAM 11 GiB</text><rect x="359.00000000000006" y="450.75" width="112" height="19.25" rx="8" fill="#55d6be" /><text x="415.00000000000006" y="436.75" fill="#55d6be" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-variant-numeric="tabular-nums" font-weight="700" text-anchor="middle">0.77 GiB</text><text x="415.00000000000006" y="500" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-variant-numeric="tabular-nums" font-weight="700" text-anchor="middle">one GPU</text><text x="415.00000000000006" y="522" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-variant-numeric="tabular-nums" text-anchor="middle">VRAM 5.6 GiB</text><rect x="582.3333333333334" y="449.5" width="112" height="20.5" rx="8" fill="#55d6be" /><text x="638.3333333333334" y="435.5" fill="#55d6be" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-variant-numeric="tabular-nums" font-weight="700" text-anchor="middle">0.82 GiB</text><text x="638.3333333333334" y="500" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-variant-numeric="tabular-nums" font-weight="700" text-anchor="middle">two workers</text><text x="638.3333333333334" y="522" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-variant-numeric="tabular-nums" text-anchor="middle">VRAM 10.5 GiB</text><rect x="820" y="160" width="320" height="320" rx="16" fill="#0f1d30" stroke="#263a53"/><text x="850" y="200" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-variant-numeric="tabular-nums" font-weight="700">Observed mechanism</text><text x="850" y="250" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-variant-numeric="tabular-nums" >one process</text><text x="850" y="278" fill="#ff7b8a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-variant-numeric="tabular-nums" font-weight="700">sees both GPUs</text><text x="850" y="325" fill="#ffb45c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-variant-numeric="tabular-nums" font-weight="700">↓</text><text x="850" y="365" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-variant-numeric="tabular-nums" font-weight="700">about 1 GiB host RAM</text><text x="850" y="392" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-variant-numeric="tabular-nums" >per 1 GiB device allocation</text><text x="850" y="438" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-variant-numeric="tabular-nums" >fix used here</text><text x="850" y="466" fill="#55d6be" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-variant-numeric="tabular-nums" font-weight="700">one mask per worker</text><rect x="60" y="535" width="1080" height="92" rx="14" fill="#12243a" stroke="#263a53"/><rect x="90" y="565" width="245" height="36" rx="8" fill="#0f1d30" stroke="#263a53"/><text x="212" y="589" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-variant-numeric="tabular-nums" font-weight="700" text-anchor="middle">ZE_AFFINITY_MASK=rank</text><text x="360" y="589" fill="#ffb45c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-variant-numeric="tabular-nums" font-weight="700" text-anchor="middle">→</text><rect x="395" y="565" width="210" height="36" rx="8" fill="#0f1d30" stroke="#263a53"/><text x="500" y="589" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-variant-numeric="tabular-nums" font-weight="700" text-anchor="middle">SYS_PTRACE</text><text x="630" y="589" fill="#ffb45c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-variant-numeric="tabular-nums" font-weight="700" text-anchor="middle">→</text><rect x="665" y="565" width="430" height="36" rx="8" fill="#0f1d30" stroke="#263a53"/><text x="880" y="589" fill="#55d6be" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-variant-numeric="tabular-nums" font-weight="700" text-anchor="middle">FP8 model loads on 32 GiB host</text><text x="60" y="665" fill="#9caec4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-variant-numeric="tabular-nums" >The measurements point to compute-runtime#986 and oneCCL#217. These are local launch workarounds; no upstream fix was verified in this run.</text>
</svg>
